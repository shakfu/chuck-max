name: release

# Runs when a GitHub release is created, or by hand. Produces unsigned
# packages as workflow artifacts:
#   chuck-max-<tag>-multi          macOS arm64 + Windows amd64 (make full MULTI=1)
#   chuck-max-<tag>-macos-x86_64   Intel macOS (make full)
#   chuck-max-<tag>-windows-amd64  Windows
# Signing, notarization and the release assets are done locally (make release,
# make release-zip).

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: build
      run: make MULTI=1

    - name: upload externals for the multi package
      uses: actions/upload-artifact@v7
      with:
        name: windows-externals
        path: externals/*.mxe64
        retention-days: 1

    - name: upload chugins for the multi package
      uses: actions/upload-artifact@v7
      with:
        name: windows-chugins
        path: examples/chugins/windows-amd64/*.chug
        retention-days: 1

    - name: upload package
      uses: actions/upload-artifact@v7
      with:
        name: chuck-max-${{ github.ref_name }}-windows-amd64
        path: |
          examples
          externals
          help
          media
          patchers
          CHANGELOG.md
          LICENSE
          README.md
          package-info.json
          icon.png

  macos:
    needs: windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15-intel

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: install dependencies
      run: brew install bison flex autogen automake flac libogg libvorbis opus mpg123 lame rubberband libsamplerate

    # arm64 builds the multi package; MULTI=1 lays chugins out per platform
    - name: build
      run: make full MULTI=${{ runner.arch == 'ARM64' && '1' || '0' }}

    - name: add Windows externals
      if: runner.arch == 'ARM64'
      uses: actions/download-artifact@v8
      with:
        name: windows-externals
        path: externals

    - name: add Windows chugins
      if: runner.arch == 'ARM64'
      uses: actions/download-artifact@v8
      with:
        name: windows-chugins
        path: examples/chugins/windows-amd64

    - name: package
      run: make package

    - name: upload multi package
      if: runner.arch == 'ARM64'
      uses: actions/upload-artifact@v7
      with:
        name: chuck-max-${{ github.ref_name }}-multi
        path: build/dist/chuck-max

    - name: upload macOS x86_64 package
      if: runner.arch != 'ARM64'
      uses: actions/upload-artifact@v7
      with:
        name: chuck-max-${{ github.ref_name }}-macos-x86_64
        path: build/dist/chuck-max
